// Top-level build file
buildscript {
    repositories {
        maven { url 'https://jitpack.io' }
        google()
        maven { url "https://gohoski.github.io/android-legacy-maven/" }
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:3.6.3'
    }
}

allprojects {
    repositories {
        maven { url 'https://jitpack.io' }
        google()
        maven { url "https://gohoski.github.io/android-legacy-maven/" }
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
